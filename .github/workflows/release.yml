name: Source release
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    concurrency:
      group: source-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read release version
        id: version
        run: python tools/release_version.py
      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Package tested sources
        if: steps.existing.outputs.exists != 'true'
        run: git archive --format=zip --prefix=Bastion-Grid/ -o Bastion-Grid-source.zip HEAD
      - name: Checksums
        if: steps.existing.outputs.exists != 'true'
        run: sha256sum Bastion-Grid-source.zip > SHA256SUMS
      - name: Publish prerelease
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: gh release create "$RELEASE_TAG" Bastion-Grid-source.zip SHA256SUMS --target "$TARGET_SHA" --prerelease --title "BASTION GRID $RELEASE_TAG — Posture and Remediation" --notes-file docs/acceptance/RELEASE_NOTES.md
