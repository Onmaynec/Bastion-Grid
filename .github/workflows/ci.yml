name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q bastion tools tests
      - run: python tools/build_contract.py
      - run: python tools/build_traceability.py
      - run: git diff --exit-code -- spec/openapi.json docs/acceptance
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m bastion init
      - run: python -m tools.ui_smoke --seed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soc-ui-check
          path: var/ui-check/
          if-no-files-found: ignore
